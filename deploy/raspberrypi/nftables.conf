#!/usr/sbin/nft -f

# FamilyRobot nftables Firewall Configuration
# Default-deny inbound for IoT VLAN isolation.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Allow loopback interface traffic
        iif "lo" accept

        # Allow established and related connections (replies to outbound traffic)
        ct state established,related accept

        # Allow ICMP (ping) for diagnostics (limit to local subnet)
        ip protocol icmp icmp type echo-request ip saddr 192.168.0.0/16 accept

        # Allow SSH (Port 22) from local home subnet/Tailscale only
        tcp dport 22 ip saddr { 192.168.0.0/16, 100.64.0.0/10 } accept

        # Allow HTTP/HTTPS (Port 80/443/8000) for Web App from home subnet
        tcp dport { 80, 443, 8000 } ip saddr 192.168.0.0/16 accept

        # Allow MQTT TLS (Port 8883) from local smart devices
        tcp dport 8883 ip saddr 192.168.0.0/16 accept

        # Log and drop everything else
        limit rate 3/minute log prefix "Default-Drop: "
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
